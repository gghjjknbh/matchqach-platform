.reg-t h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5.5vw,34px);line-height:1.2}
.reg-t p{color:var(--muted);font-size:14px;margin-top:2px}
.reg-cta{min-height:52px;padding:8px 28px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 8px 18px -8px rgba(37,99,235,.7);transition:filter .2s}

.reg-perks{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.reg-perks li{background:var(--tint);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.reg-form{border-top:1.5px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.reg-submit{min-height:52px;font-size:16px}
.rgmodal{position:fixed;inset:0;z-index:18;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;font-family:var(--f-body);color:var(--ink)}
.rgbox{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 48px -16px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.rgbox h2{font-family:var(--f-display);font-size:24px;color:var(--open)}

    } else if (s.manual && s.manual !== 'auto' && s.manual !== 'soon') {
      if (Date.now() - s.statusAt > 43200000) return { state: 'unknown', rank: 2, mins: 0 };
      if (s.manual === 'open') return { state: 'open', rank: 0, mins: 0, manual: true };
      if (s.manual === 'break') return { state: 'break', rank: 2, mins: 0 };

  /* ======================================================================
     Private edit links (ECDSA P-256).
     The shop record holds only a PUBLIC key. The token in the link is the

     ====================================================================== */

      return await subtle.verify(SIG, k, unb64u(sig), enc.encode(text));
    } catch (e) { return false; }

    try {

    } catch (e) { return false; }
  }

  /* ?edit=ID&token=TOKEN is the standard form. The #edit.ID.TOKEN tail makes the same link work where the
     address query is not passed to the page (for example inside the Claude viewer). */
  function ownerLink(id, token) {
    var b = linkBase();

  }
  function parseOwnerLink(str) {

    if (a && t) return { id: a[1], token: t[1] };

     Storage adapter. watchOverrides() and saveOverride() are the only code
     that touches the database; swap them to move to another backend.
     ====================================================================== */
  var emb = data.shops.slice(), ext = [], base = emb.slice(), baseById = dict(), embIds = dict(), ovRaw = dict();
  emb.forEach(function (s) { embIds[s.id] = 1; });
  base.forEach(function (s) { baseById[s.id] = s; });

  var regList = [];

    base = emb.concat(regList, ext);

    base.forEach(function (s) { baseById[s.id] = s; });
    var jobs = [];
    regList.concat(ext).forEach(function (s) { var l = ovRaw[s.id]; if (l) l.forEach(function (d) { jobs.push(acceptOverride(s.id, d)); }); });
    return Promise.all(jobs).then(rebuild);

  async function acceptOverride(id, doc) {
    var s = validId(id) ? baseById[id] : null;
    if (!s || !s.pub || !doc || typeof doc.payload !== 'string' || typeof doc.sig !== 'string' || doc.sig.length > 120 || doc.payload.length > 4000) return;
    if (ovSig[doc.sig]) return;
    ovSig[doc.sig] = 1;
    var p;
    try { p = JSON.parse(doc.payload); } catch (e) { return; }
    if (!p || p.id !== id || typeof p.at !== 'number' || !isFinite(p.at) || p.at > Date.now() + 3600000 || !p.f || typeof p.f !== 'object') return;
    if (ovOk[id] && p.at <= ovOk[id].at) return;
    if (!(await verifyText(s.pub, doc.payload, doc.sig))) return;
    if (ovOk[id] && p.at <= ovOk[id].at) return;
    ovOk[id] = { at: p.at, f: p.f };
  }

  /* each signed-in writer owns one document "ov/<uid>" holding {items: {shopId: {payload, sig}}};
     nobody can overwrite another writer's document, and every update touches one small record */
  function watchOverrides() {
    if (!dbNS || ovUnsub) return;
    var done = function () { if (ovResolve) { ovResolve(); ovResolve = null; } };
    try {
      ovUnsub = dbNS.collection('ov').onSnapshot(function (snap) {
        var jobs = [];
        snap.docs.forEach(function (d) {
          var b = d.data(), it = b && b.items;
          if (!it || typeof it !== 'object') return;
          Object.keys(it).slice(0, 100).forEach(function (id) {
            if (!validId(id)) return;
            var d = it[id], l = ovRaw[id] || (ovRaw[id] = []);
            if (d && typeof d.sig === 'string' && !l.some(function (x) { return x.sig === d.sig; })) { l.push(d); if (l.length > 4) l.shift(); }
            jobs.push(acceptOverride(id, d));
          });
        });
        Promise.all(jobs).then(function () {
          rebuild();
          if (view === 'board') updateBoard();
          done();
        });
      }, done);
    } catch (e) { done(); }
  }

  function saveOverride(shop, token, clean) {
    var run = async function () {
      var f = {};
      OVF.forEach(function (k) { f[k] = clean[k]; });
      var payload = JSON.stringify({ id: shop.id, at: Date.now(), f: f });
      var sig = await signText(token, shop.pub, payload);
      var ref = dbNS.doc('ov/' + uid), cur = await ref.get();
      var items = (cur.exists && cur.data() && cur.data().items) || {}, keys = Object.keys(items);
      if (keys.length > 100 && !items[shop.id]) delete items[keys[0]];
      items[shop.id] = { payload: payload, sig: sig };
      await ref.set({ items: items });
      await acceptOverride(shop.id, { payload: payload, sig: sig });
      rebuild();
    };
    ovChain = ovChain.then(run, run);
    return ovChain;
  }

  /* ======================================================================

    });

  /* ======================================================================
     Large catalogues: shops are stored as small per-wilaya files (data/index.json,
     data/w<code>-<part>.json, compact rows) written by make_shards.py. Only the
     chosen wilaya is fetched, part by part, so the page stays light with
     hundreds of thousands of shops. Without data/index.json nothing changes.
     ====================================================================== */
  var SHARD = { on: false, idx: null, tok: 0, msg: '' };
  var KINDS = ['service', 'shop', 'product', 'goods'];
  function rowShop(r, wil) {
    if (!Array.isArray(r)) return null;
    var off = [];
    for (var d = 0; d < 7; d++) if ((r[15] | 0) & (1 << d)) off.push(d);
    return cleanShop({
      id: r[0], name: r[1], owner: r[2], phone: r[3], address: r[4], wilaya: wil, daira: r[5], baladiya: r[6], map: r[7], cat: r[8], wa: r[9],
      kind: KINDS[r[10] | 0] || 'shop', prices: r[11], note: r[12], open: r[13], close: r[14], offDays: off, paused: r[16] === 1,
      pub: r[17] && r[18] ? { x: r[17], y: r[18] } : null, baseAt: 0
    });
  }
  async function fetchJson(path) {
    var res = await fetch(path, { cache: 'no-cache' });
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }
  async function loadIndex() {
    try {
      var ix = await fetchJson('data/index.json');
      if (!ix || ix.v !== 1 || !ix.w || typeof ix.w !== 'object') return;
      var w = dict();
      Object.keys(ix.w).forEach(function (k) {
        var m = ix.w[k], n = m && m.n | 0, p = m && m.parts | 0;
        if (/^\d{1,2}$/.test(k) && +k >= 1 && +k <= WILAYAS.length && n > 0 && p > 0 && p <= 200) w[k] = { n: n, parts: p };
      });
      var ps = ix.ps | 0;
      SHARD.idx = { v: 1, w: w, ps: ps >= 100 && ps <= 20000 ? ps : 5000 }; SHARD.on = true;
    } catch (e) { SHARD.on = false; }
  }
  /* an owner link opens one shop: ids look like p<wilaya code>_<number>, so only the one part holding it is fetched */
  async function fetchOne(id) {
    var m = /^p(\d{1,2})_(\d{1,8})$/.exec(id);
    if (!SHARD.on || !m || !SHARD.idx.w[String(+m[1])]) return null;
    try {
      var part = await fetchJson('data/w' + (+m[1]) + '-' + Math.floor(+m[2] / SHARD.idx.ps) + '.json');
      if (!Array.isArray(part)) return null;
      for (var i = 0; i < part.length; i++) {
        if (part[i] && part[i][0] === id) {
          var s = rowShop(part[i], WILAYAS[+m[1] - 1]);
          if (s) await setExt(ext.concat([s]));
          return s;
        }
      }
    } catch (e) { /* not found */ }
    return null;
  }
  async function selectWilaya(name) {
    var tk = ++SHARD.tok;
    SHARD.msg = '';
    if (!SHARD.on || !name) { await setExt([]); lastList = ''; updateBoard(); return; }
    var code = WILAYAS.indexOf(name) + 1, m = SHARD.idx.w[String(code)];
    if (!m) { await setExt([]); updateBoard(); return; }
    var rows = [];
    await setExt([]);
    for (var p = 0; p < m.parts; p++) {
      SHARD.msg = L.loadingW(p + 1, m.parts);
      updateBoard();
      try {
        var part = await fetchJson('data/w' + code + '-' + p + '.json');
        if (tk !== SHARD.tok) return;
        if (!Array.isArray(part)) throw new Error('bad part');
        for (var i = 0; i < part.length; i++) { var s = rowShop(part[i], name); if (s) rows.push(s); }
        await setExt(rows.slice());
        lastList = '';
      } catch (e) {
        if (tk === SHARD.tok) { SHARD.msg = L.loadFailW; updateBoard(); }
        return;
      }
    }
    SHARD.msg = '';
    updateBoard();
  }

      return c;
    }).filter(Boolean);
    var out = { demo: false, base: siteBase, shops: shops };
    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    setMsg(E.saving, false);
    var doc = buildDoc(out);

    try { sessionStorage.setItem('mq-links', JSON.stringify({ t: Date.now(), l: links })); } catch (e) { /* no storage */ }

      await artifactNS.publish(doc);
      setMsg(E.saved, false);
    } catch (err2) {
      try { sessionStorage.removeItem('mq-links'); } catch (e) { /* no storage */ }

      if (code === 'conflict') setMsg(E.conflict, true);

    updateOwnerStatus();
    await ownerSave();
  }
  async function allTokens() {
    var n = 0;
    for (var i = 0; i < draft.length; i++) {
      if (draft[i].pub) continue;
      try { var k = await newKeys(); draft[i].pub = k.pub; draft[i]._tok = k.token; n++; } catch (e) { break; }
    }
    renderEdList();
    toast(L.ed.tokAllDone(n));
  }
  function copyAllLinks() {
    var arr = readLinks();
    var text = arr.map(function (x) { return txt(x && x.n, 80) + '\t' + safeHttps(x && x.l); }).join('\n');
    var fail = function () { toast(L.selectIt); };
    try { navigator.clipboard.writeText(text).then(function () { toast(L.copiedAll); }, fail); } catch (e) { fail(); }
  }

  app.addEventListener('click', function (e) {
    var r = e.target.closest('button[data-rate]');
    if (r) {
      var rid = r.getAttribute('data-rate-id'), rv = parseInt(r.getAttribute('data-rate'), 10);
      if (rates[rid] === rv) delete rates[rid]; else rates[rid] = rv;
      store('mq-rates', JSON.stringify(rates));
      updateBoard();
      return;
    }
    var t = e.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-lang')) {
      var nl = t.getAttribute('data-lang');
      if (nl !== lang && LANGS[nl]) {
        lang = nl;
        store('mq-lang', lang);
        rerender();
      }
      return;
    }
    if (t.hasAttribute('data-copy')) { copyNumber(t); return; }
    if (t.hasAttribute('data-ostat')) { ownerStatus(t.getAttribute('data-ostat'), parseInt(t.getAttribute('data-mins'), 10) || 0); return; }
    if (t.hasAttribute('data-kind')) { var kk = t.getAttribute('data-kind'); kfilter = kfilter === kk ? '' : kk; shown = PAGE; updateBoard(); return; }
    if (t.hasAttribute('data-filter')) { filter = t.getAttribute('data-filter'); shown = PAGE; updateBoard(); return; }
    var act = t.getAttribute('data-act');
    if (!act) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    if (act === 'regtoggle') regToggle();
    else if (act === 'regsubmit') registerShop();
    else if (act === 'edit') startEdit();
    else if (act === 'cancel') renderBoardShell();
    else if (act === 'more') { shown += PAGE; updateBoard(); }
    else if (act === 'edmore') { edLimit += 20; renderEdList(); }
    else if (act === 'add') addShop();
    else if (act === 'alltok') allTokens();
    else if (act === 'newtok') { if (draft[i]) makeToken(draft[i]); }
    else if (act === 'del') { if (draft[i]) { draft[i]._c = true; renderEdList(); } }
    else if (act === 'delno') { if (draft[i]) { draft[i]._c = false; renderEdList(); } }
    else if (act === 'delyes') { draft.splice(i, 1); renderEdList(); }
    else if (act === 'save') save();
    else if (act === 'ownersave') ownerSave();
    else if (act === 'ownerback') { owner = null; od = {}; renderBoardShell(); }
    else if (act === 'hidelinks') { try { sessionStorage.removeItem('mq-links'); } catch (x) { /* no storage */ } showNewLinks(); }
    else if (act === 'copyall') copyAllLinks();
    else if (act === 'ownergo') {
      var inp = document.getElementById('ownin'), p = parseOwnerLink(inp && inp.value);
      if (!p) { ownerMsg(L.ownerBad); return; }
      startOwner(p.id, p.token).then(function (ok) { if (!ok) ownerMsg(L.ownerBad); });
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-r')) { regInput(t); return; }
    if (t.id === 'q') { query = t.value; shown = PAGE; clearTimeout(qTimer); qTimer = setTimeout(updateBoard, data.shops.length > 3000 ? 160 : 0); return; }
    if (t.id === 'wsel') {
      wfilter = t.value; shown = PAGE;
      store('mq-w', wfilter);
      if (SHARD.on) selectWilaya(wfilter); else updateBoard();
      return;
    }
    if (t.id === 'csel') { cfilter = t.value; shown = PAGE; updateBoard(); return; }
    if (t.hasAttribute('data-bkf')) { var bk = t.closest('.bk'); if (bk) updateBook(bk); return; }
    if (view === 'owner') {
      var of = t.getAttribute('data-o');
      if (!of) return;
      if (of === 'day') {
        var od1 = parseInt(t.getAttribute('data-day'), 10), a1 = od.offDays, at1 = a1.indexOf(od1);
        if (t.checked && at1 < 0) a1.push(od1);
        if (!t.checked && at1 > -1) a1.splice(at1, 1);
      } else if (of === 'paused') od.paused = t.checked;
      else od[of] = t.value;
      updateOwnerStatus();
      return;
    }
    if (view !== 'edit') return;
    if (t.id === 'edq') { edQ = t.value; edLimit = 20; clearTimeout(qTimer); qTimer = setTimeout(function () { renderEdList(); }, 150); return; }
    if (t.id === 'edbase') { siteBase = safeHttps(t.value); clearTimeout(qTimer); qTimer = setTimeout(function () { renderEdList(); }, 300); return; }
    var i = parseInt(t.getAttribute('data-i'), 10), f = t.getAttribute('data-f');
    if (isNaN(i) || !f || !draft[i]) return;
    if (f === 'day') {
      var d = parseInt(t.getAttribute('data-day'), 10), arr = draft[i].offDays, at = arr.indexOf(d);
      if (t.checked && at < 0) arr.push(d);
      if (!t.checked && at > -1) arr.splice(at, 1);
    } else if (f === 'paused') draft[i][f] = t.checked;
    else draft[i][f] = t.value;
  });

  renderBoardShell();
  setInterval(function () {
    var l = document.getElementById('list');
    if (view === 'board' && l && l.querySelector('details[open]')) { renderClock(algiersNow()); return; }
    updateBoard();
  }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) updateBoard(); });

  (async function () {
    try {
      if (window.claude && window.claude.use) {
        var caps = await Promise.all([window.claude.use('artifact'), window.claude.use('user'), window.claude.use('db')]);
        artifactNS = caps[0]; dbNS = caps[2];
        if (caps[1] && caps[1].id) { try { uid = await caps[1].id(); } catch (e) { uid = null; } }
        if (artifactNS && caps[1] && cssEl && jsEl) canEdit = await caps[1].canEdit();
        watchOverrides();
        watchRegs();
      }
    } catch (e) { /* page works read-only */ }
    if (canEdit) { showManage(); }
    await loadIndex();
    if (SHARD.on) {
      var sw = '';
      try { sw = localStorage.getItem('mq-w') || ''; } catch (e) { /* no storage */ }
      if (sw && SHARD.idx.w[String(WILAYAS.indexOf(sw) + 1)]) { wfilter = sw; selectWilaya(sw); }
    }
    updateBoard();
    await openFromUrl();
  })();
})();
</script>
</body></html>
